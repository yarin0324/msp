version: '3.8'

services:
  # ----------------------------------------------------
  # 基礎設施 (Infrastructure)
  # ----------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: msp-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 自動執行 DB 初始化與種子資料
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: msp-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/entrypoint.sh"]
    environment:
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: msp-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: msp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  consul:
    image: hashicorp/consul:1.16
    container_name: msp-consul
    command: "agent -server -bootstrap-expect=1 -ui -client=0.0.0.0"
    ports:
      - "8500:8500"

  # 分散式鏈路追蹤後台 (Jaeger Tracing with OTLP)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: msp-jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC 收集埠
      - "4318:4318"   # OTLP HTTP 收集埠
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ----------------------------------------------------
  # API 網關 (API Gateway - YARP)
  # ----------------------------------------------------
  webapigateway:
    build:
      context: .
      dockerfile: src/ApiGateways/WebApiGateway/Dockerfile
    container_name: msp-webapigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ReverseProxy__Clusters__order-cluster__Destinations__order-service-local__Address=http://order-service:5125
      - ReverseProxy__Clusters__inventory-cluster__Destinations__inventory-service-local__Address=http://inventory-service:5271
      - ReverseProxy__Clusters__product-cluster__Destinations__product-service-local__Address=http://product-service:5272
      - ReverseProxy__Clusters__basket-cluster__Destinations__basket-service-local__Address=http://basket-service:5079
      - ReverseProxy__Clusters__identity-cluster__Destinations__identity-service-local__Address=http://identity-service:5184
      - ReverseProxy__Clusters__payment-cluster__Destinations__payment-service-local__Address=http://payment-service:5198
      - Consul__Address=http://consul:8500
    ports:
      - "5000:5000"
    depends_on:
      - consul
      - jaeger
      - order-service
      - inventory-service
      - product-service
      - basket-service
      - identity-service
      - payment-service

  # ----------------------------------------------------
  # 微服務 (Microservices)
  # ----------------------------------------------------
  order-service:
    build:
      context: .
      dockerfile: src/Services/OrderService/Order.API/Dockerfile
    container_name: msp-order-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ConnectionStrings__OrderDb=Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672/
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5125:5125"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      consul:
        condition: service_started
      jaeger:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: src/Services/InventoryService/InventoryService.WebApi/Dockerfile
    container_name: msp-inventory-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ConnectionStrings__InventoryDb=Server=sqlserver,1433;Database=InventoryDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "5271:5271"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
      jaeger:
        condition: service_started

  product-service:
    build:
      context: .
      dockerfile: src/Services/Product.API/Dockerfile
    container_name: msp-product-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    ports:
      - "5272:5272"
    depends_on:
      - jaeger

  basket-service:
    build:
      context: .
      dockerfile: src/Services/BasketService/Basket.API/Dockerfile
    container_name: msp-basket-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5079:5079"
    depends_on:
      - redis
      - jaeger

  identity-service:
    build:
      context: .
      dockerfile: src/Services/Identity.API/Dockerfile
    container_name: msp-identity-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    ports:
      - "5184:5184"
    depends_on:
      - jaeger

  payment-service:
    build:
      context: .
      dockerfile: src/Services/Payment.API/Dockerfile
    container_name: msp-payment-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "5198:5198"
    depends_on:
      - redis
      - jaeger
      - rabbitmq

# ----------------------------------------------------
# 共享卷 (Volumes)
# ----------------------------------------------------
volumes:
  sqlserver_data:
  rabbitmq_data:
  redis_data:
